name: Fetch vendor libs
on:
  push:
    paths: ['vendor/*.url', 'vendor/jsm.list']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download vendor files
        run: |
          set -e
          for f in vendor/*.url; do
            name=$(basename "$f" .url)
            if [ ! -f "vendor/$name" ]; then
              curl -sSL --fail -o "vendor/$name" "$(head -n1 "$f")"
              echo "downloaded $name"
            fi
          done
          if [ -f vendor/jsm.list ]; then
            while read -r rel; do
              [ -z "$rel" ] && continue
              if [ ! -f "vendor/jsm/$rel" ]; then
                mkdir -p "vendor/jsm/$(dirname "$rel")"
                curl -sSL --fail -o "vendor/jsm/$rel" "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/$rel"
                echo "downloaded jsm/$rel"
              fi
            done < vendor/jsm.list
          fi
      - name: Commit
        run: |
          git config user.name "eyla-bot"
          git config user.email "eyla-bot@users.noreply.github.com"
          git add vendor/ || true
          git diff --cached --quiet || (git commit -m "vendor: fetched" && git push)
