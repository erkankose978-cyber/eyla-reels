<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:P;src:url(fonts/Poppins-Light.ttf);font-weight:300}
@font-face{font-family:L;src:url(fonts/Lora-Italic-Variable.ttf);font-style:italic;font-weight:400 700}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><script src="logos.js"></script><script src="cues.js"></script><canvas id="c" width="1080" height="1920"></canvas>
<script>
const c=document.getElementById('c'), g=c.getContext('2d'); const W=1080,H=1920;
const imgs={}; const loadImg=(k,s)=>new Promise(r=>{const i=new Image();i.onload=()=>{imgs[k]=i;r()};i.src=s;});
window.ready=Promise.all([loadImg('logoW',window.LOGO_W),document.fonts.load('700 40px P'),document.fonts.load('500 40px P'),document.fonts.load('400 40px P'),document.fonts.load('300 40px P'),document.fonts.load('italic 500 40px L')]);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x, eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function win(t,a,b,fi=.35,fo=.35){ if(t<a||t>b) return 0; return Math.min(eOut(prog(t,a,a+fi)), fo>0?1-eIn(prog(t,b-fo,b)):1); }
function rr(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }
const D={ink:'#0E0B09',bg1:'#2B231D',bg2:'#120F0C',cream:'#F4EDE4',muted:'#A99D90',gold:'#D9B57F',gold2:'#F0D3A2',good:'#8BCB93',bad:'#F07A5F'};

// ---------- film grain (seeded) ----------
const grain=document.createElement('canvas'); grain.width=grain.height=256;
{ const x=grain.getContext('2d'), id=x.createImageData(256,256); let s=1234567;
  for(let i=0;i<id.data.length;i+=4){ s=(s*1103515245+12345)&0x7fffffff; const v=(s>>16)&255; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; } x.putImageData(id,0,0); }
function post(t){
  // vignette
  const v=g.createRadialGradient(W/2,H*.45,H*.25,W/2,H*.5,H*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)'); g.fillStyle=v; g.fillRect(0,0,W,H);
  // grain
  g.save(); g.globalAlpha=.055; g.globalCompositeOperation='overlay'; const f=Math.floor(t*30); const ox=(f*97)%256, oy=(f*61)%256;
  g.translate(-ox,-oy); const p=g.createPattern(grain,'repeat'); g.fillStyle=p; g.fillRect(0,0,W+256,H+256); g.restore();
}
function bg(t){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,D.bg1); gr.addColorStop(1,D.bg2); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // drifting warm light
  const lx=W*.5+Math.sin(t*.35)*160, ly=H*.42+Math.cos(t*.27)*90;
  const l=g.createRadialGradient(lx,ly,0,lx,ly,760); l.addColorStop(0,'rgba(217,181,127,.20)'); l.addColorStop(1,'rgba(217,181,127,0)'); g.fillStyle=l; g.fillRect(0,0,W,H);
  // fine blueprint dots
  g.fillStyle='rgba(244,237,228,.05)'; for(let y=40;y<H;y+=48) for(let x=36;x<W;x+=48){ g.fillRect(x,y,2,2); }
}
function topBar(){
  const lw=104, lh=lw*imgs.logoW.height/imgs.logoW.width; g.drawImage(imgs.logoW,W/2-lw/2,64,lw,lh);
  g.font='500 19px P'; g.fillStyle='rgba(244,237,228,.5)'; g.textAlign='center'; g.textBaseline='middle';
  g.letterSpacing='6px'; g.fillText('#SANTİMİSANTİMİNE',W/2,64+lh+26); g.letterSpacing='0px';
}

// ---------- kinetic headline ----------
// words: [text, style]  style: 'n' normal, 'i' italic gold accent
function headline(t, t0, lines, y, size=74, stagger=.09){
  let k=0; const LH=size*1.22;
  lines.forEach((ln,li)=>{
    const meas=ln.map(([w,s])=>{ g.font= s==='i'? `italic 600 ${size*1.08}px L` : `700 ${size}px P`; return g.measureText(w).width; });
    const sp=size*.28, tot=meas.reduce((a,b)=>a+b,0)+sp*(ln.length-1); let x=W/2-tot/2;
    ln.forEach(([w,s],wi)=>{
      const p=prog(t,t0+k*stagger,t0+k*stagger+.45); k++;
      if(p>0){ const e=eOut(p);
        g.save(); g.globalAlpha*=e; g.filter=`blur(${(1-e)*10}px)`;
        g.font= s==='i'? `italic 600 ${size*1.08}px L` : `700 ${size}px P`;
        g.fillStyle= s==='i'? D.gold2 : D.cream; g.textAlign='left'; g.textBaseline='alphabetic';
        g.fillText(w,x,y+li*LH+(1-e)*40); g.restore(); }
      x+=meas[wi]+sp; });
  });
}
// karaoke caption
function caption(t, t0, t1, words){
  const a=win(t,t0,t1,.2,.2); if(a<=0) return;
  g.save(); g.globalAlpha=a; g.font='600 50px P'; g.textBaseline='middle';
  const sp=16, ws=words.map(w=>g.measureText(w).width); const lines=[[]]; let lw=0;
  words.forEach((w,i)=>{ if(lw+ws[i]>900 && lines[lines.length-1].length){ lines.push([]); lw=0; } lines[lines.length-1].push(i); lw+=ws[i]+sp; });
  const per=(t1-t0-.3)/words.length; const y0=1690-(lines.length-1)*40;
  lines.forEach((ln,li)=>{ const tot=ln.reduce((s,i)=>s+ws[i],0)+sp*(ln.length-1); let x=W/2-tot/2; const y=y0+li*80;
    ln.forEach(i=>{ const w=words[i], on=t>=t0+i*per, cur=on && t<t0+(i+1)*per;
      if(cur){ g.fillStyle=D.gold; rr(x-10,y-36,ws[i]+20,72,16); g.fill(); }
      g.fillStyle= cur? D.ink : (on? D.cream : 'rgba(244,237,228,.35)'); g.textAlign='left'; g.fillText(w,x,y); x+=ws[i]+sp; }); });
  g.restore();
}
// ---------- isometric engine ----------
let ISO={cx:540,cy:800,s:1.2};
const C30=Math.cos(Math.PI/6), S30=.5;
function P(x,y,z){ return [ISO.cx+(x-y)*C30*ISO.s, ISO.cy+(x+y)*S30*ISO.s - z*ISO.s]; }
function poly(pts,fill,stroke){ g.beginPath(); pts.forEach((p,i)=>{ const q=P(...p); i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]); }); g.closePath(); if(fill){g.fillStyle=fill;g.fill();} if(stroke){g.strokeStyle=stroke;g.stroke();} }
function shade(hex,k){ const n=parseInt(hex.slice(1),16); let r=n>>16,gg=(n>>8)&255,b=n&255; const f=v=>Math.round(clamp(v*k,0,255)); return `rgb(${f(r)},${f(gg)},${f(b)})`; }
function box(x,y,z,w,d,h,col,alpha=1){
  if(alpha<=0) return; g.save(); g.globalAlpha*=alpha;
  // contact shadow
  if(z<2){ g.save(); g.filter='blur(10px)'; poly([[x-6,y-6+8,0],[x+w+10,y-6+8,0],[x+w+10,y+d+14,0],[x-6,y+d+14,0]],'rgba(0,0,0,.28)'); g.restore(); }
  g.lineWidth=1.2; g.lineJoin='round';
  poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],shade(col,.78),'rgba(0,0,0,.12)'); // front-left (faces +y)
  poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],shade(col,.62),'rgba(0,0,0,.12)'); // front-right (faces +x)
  poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],shade(col,1.05),'rgba(255,255,255,.18)');
  g.restore();
}
const RX=460, RY=420, RH=260;
function room(t){
  // floor
  const fl=g.createLinearGradient(...P(0,0,0),...P(RX,RY,0)); fl.addColorStop(0,'#D9CBB8'); fl.addColorStop(1,'#BFAE97');
  poly([[0,0,0],[RX,0,0],[RX,RY,0],[0,RY,0]],fl);
  // floor planks
  g.strokeStyle='rgba(90,70,50,.12)'; g.lineWidth=1.2; for(let x=30;x<RX;x+=30){ const a=P(x,0,0),b=P(x,RY,0); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); }
  // walls
  poly([[0,0,0],[0,RY,0],[0,RY,RH],[0,0,RH]],'#E8DFD3'); // left wall x=0
  poly([[0,0,0],[RX,0,0],[RX,0,RH],[0,0,RH]],'#F2EBE1'); // right wall y=0
  // wall light from window
  g.save(); g.globalAlpha=.35; const wl=g.createLinearGradient(...P(RX,0,RH),...P(0,0,0)); wl.addColorStop(0,'rgba(255,240,210,.9)'); wl.addColorStop(1,'rgba(255,240,210,0)'); poly([[0,0,0],[RX,0,0],[RX,0,RH],[0,0,RH]],wl); g.restore();
  // window on right wall
  poly([[300,0,90],[420,0,90],[420,0,220],[300,0,220]],'#AFC6D1'); g.lineWidth=6; poly([[300,0,90],[420,0,90],[420,0,220],[300,0,220]],null,'#FFFFFF');
  g.lineWidth=3; { const a=P(360,0,90),b=P(360,0,220); g.strokeStyle='#fff'; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); }
  // door on left wall
  poly([[0,300,0],[0,390,0],[0,390,210],[0,300,210]],'#9C8571'); g.lineWidth=2; poly([[0,306,0],[0,384,0],[0,384,204],[0,306,204]],null,'rgba(0,0,0,.2)');
  { const k=P(0,374,100); g.fillStyle=D.gold; g.beginPath(); g.arc(k[0],k[1],5,0,7); g.fill(); }
  // skirting
  g.lineWidth=4; g.strokeStyle='rgba(255,255,255,.7)'; { const a=P(0,RY,0),b=P(0,0,0),c2=P(RX,0,0); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...c2); g.stroke(); }
}
function rugIso(x,y,w,d,col,edge,alpha=1){ if(alpha<=0) return; g.save(); g.globalAlpha*=alpha;
  poly([[x,y,1],[x+w,y,1],[x+w,y+d,1],[x,y+d,1]],col);
  g.lineWidth=3; poly([[x+12,y+12,1.5],[x+w-12,y+12,1.5],[x+w-12,y+d-12,1.5],[x+12,y+d-12,1.5]],null,'rgba(255,255,255,.35)');
  if(edge){ g.setLineDash([14,9]); g.lineWidth=5; poly([[x-6,y-6,2],[x+w+6,y-6,2],[x+w+6,y+d+6,2],[x-6,y+d+6,2]],null,edge); g.setLineDash([]); }
  g.restore(); }
function sofa(x,y,len,col,alpha=1,lift=0){ // sofa along y axis, back against x=x side
  box(x,y,lift,90,len,42,col,alpha); box(x,y,lift+42,22,len,40,col,alpha); box(x,y,lift+42,90,18,22,col,alpha); box(x,y+len-18,lift+42,90,18,22,col,alpha);
}
function lamp(cx,cy,zb,alpha=1,col='#F0D3A2'){ if(alpha<=0) return; g.save(); g.globalAlpha*=alpha;
  const top=P(cx,cy,RH), b=P(cx,cy,zb+28); g.strokeStyle='rgba(30,25,20,.7)'; g.lineWidth=2; g.beginPath(); g.moveTo(...top); g.lineTo(...b); g.stroke();
  const p=P(cx,cy,zb); const gl=g.createRadialGradient(p[0],p[1]+10,0,p[0],p[1]+10,140); gl.addColorStop(0,'rgba(255,220,160,.45)'); gl.addColorStop(1,'rgba(255,220,160,0)'); g.fillStyle=gl; g.beginPath(); g.arc(p[0],p[1]+10,140,0,7); g.fill();
  g.fillStyle='#2B2420'; g.beginPath(); g.moveTo(p[0]-34,p[1]+6); g.lineTo(p[0]+34,p[1]+6); g.lineTo(p[0]+14,p[1]-26); g.lineTo(p[0]-14,p[1]-26); g.closePath(); g.fill();
  g.fillStyle=col; g.beginPath(); g.ellipse(p[0],p[1]+6,34,8,0,0,7); g.fill(); g.restore(); }
function outlet(x,z,alpha=1){ if(alpha<=0) return; g.save(); g.globalAlpha*=alpha; poly([[x,0,z],[x+14,0,z],[x+14,0,z+14],[x,0,z+14]],'#fff','rgba(0,0,0,.3)'); g.restore(); }
function personIso(x,y,alpha=1){ if(alpha<=0) return; g.save(); g.globalAlpha*=alpha; const f=P(x,y,0), h=P(x,y,175);
  g.fillStyle='rgba(244,237,228,.92)'; g.beginPath(); g.arc(h[0],h[1]+14,14,0,7); g.fill(); rr(f[0]-14,h[1]+32,28,f[1]-h[1]-32,12); g.fill(); g.restore(); }

// ---------- UI chips ----------
function chip(x,y,text,col,a=1,sc=1,fs=28,icon){
  if(a<=0) return; g.save(); g.globalAlpha*=a;
  g.font=`600 ${fs}px P`; const tw=g.measureText(text).width, iw=icon?fs*1.1:0, w=tw+44+iw, h=fs*1.9; g.setTransform(1,0,0,1,0,0); x=clamp(x,w/2*sc+40,W-w/2*sc-40); g.translate(x,y); g.scale(sc,sc);
  g.shadowColor='rgba(0,0,0,.45)'; g.shadowBlur=24; g.shadowOffsetY=8;
  g.fillStyle='rgba(20,16,13,.82)'; rr(-w/2,-h/2,w,h,h/2); g.fill(); g.shadowColor='transparent';
  g.strokeStyle=col; g.lineWidth=2.5; rr(-w/2,-h/2,w,h,h/2); g.stroke();
  if(icon){ g.fillStyle=col; g.beginPath(); g.arc(-w/2+22+fs*.45,0,fs*.45,0,7); g.fill(); g.fillStyle=D.ink; g.font=`700 ${fs*.6}px P`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(icon,-w/2+22+fs*.45,1); }
  g.fillStyle=D.cream; g.font=`600 ${fs}px P`; g.textAlign='left'; g.textBaseline='middle'; g.fillText(text,-w/2+22+iw,1); g.restore(); }
function glass(x,y,w,h,r=28,stroke='rgba(217,181,127,.45)'){
  g.save(); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=40; g.shadowOffsetY=16;
  const gr=g.createLinearGradient(x,y,x,y+h); gr.addColorStop(0,'rgba(60,50,42,.78)'); gr.addColorStop(1,'rgba(22,18,15,.86)'); g.fillStyle=gr; rr(x,y,w,h,r); g.fill(); g.restore();
  const sg=g.createLinearGradient(x,y,x+w,y+h); sg.addColorStop(0,'rgba(255,240,215,.55)'); sg.addColorStop(.5,stroke); sg.addColorStop(1,'rgba(255,240,215,.08)');
  g.strokeStyle=sg; g.lineWidth=2; rr(x+1,y+1,w-2,h-2,r); g.stroke(); }
