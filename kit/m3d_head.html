<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:P;src:url(fonts/Poppins-Light.ttf);font-weight:300}
@font-face{font-family:L;src:url(fonts/Lora-Italic-Variable.ttf);font-style:italic;font-weight:400 700}
html,body{margin:0;background:#000}canvas#c{display:block}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/"}}</script>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';
const W=1080,H=1920;
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setSize(W,H,false); R.setPixelRatio(1);
R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.0;
R.outputColorSpace=THREE.SRGBColorSpace;
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
const C=document.getElementById('c'), X=C.getContext('2d');

// ---------- noise ----------
function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
 const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o=5){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s;}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function canvasTex(size,fn,rep=[1,1],srgb=true){
 const cv=document.createElement('canvas');cv.width=cv.height=size;const g=cv.getContext('2d');
 const im=g.createImageData(size,size);const d=im.data;
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){const c=fn(x/size,y/size);const i=(y*size+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}
 g.putImageData(im,0,0);const t=new THREE.CanvasTexture(cv);
 t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);
 if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
// marble: base + warped veins
window.marbleTex=(base=[150,132,118],vein=[214,196,170],dark=[98,84,74],seed=0)=>canvasTex(1024,(u,v)=>{
 const w=fbm(u*3+seed,v*3,5)*4.0;
 const n=Math.abs(Math.sin((u*2.2+v*3.1)*6+w*3.2));
 const n2=Math.abs(Math.sin((u*-3.5+v*1.4)*5+fbm(u*5,v*5+seed,4)*5));
 const ve=Math.pow(1-clamp(n),26)*.9+Math.pow(1-clamp(n2),40)*.6;
 const cl=fbm(u*8,v*8+seed,4);
 let c=base.map((b,i)=>lerp(b,dark[i],clamp((cl-.45)*1.6)));
 c=c.map((b,i)=>lerp(b,vein[i],clamp(ve)));return c;});
// travertine/wood-like streaks (horizontal)
window.streakTex=(a=[150,128,104],b=[196,176,150],seed=3)=>canvasTex(1024,(u,v)=>{
 const s=fbm(u*1.5+seed,v*40,5);const s2=fbm(u*6,v*120+seed,3);
 const t=clamp(s*1.3-.15+(s2-.5)*.3);return a.map((x,i)=>lerp(x,b[i],t));});
window.flutedTex=()=>canvasTex(512,(u,v)=>{const r=.55+.45*Math.cos(u*Math.PI*2*40);const g=Math.pow(1-v,.6);
 const k=clamp(r*g*1.1);return [255*k*.95,170*k*.85,90*k*.6];},[1,1]);

// ---------- environment (reflections: room + window) ----------
function makeEnv(){
 const s=new THREE.Scene();
 const wall=new THREE.MeshBasicMaterial({color:0x8a7c70,side:THREE.BackSide});
 s.add(new THREE.Mesh(new THREE.BoxGeometry(12,4,12),wall));
 const win=new THREE.MeshBasicMaterial({color:0xffffff});win.color.multiplyScalar(6);
 const mull=new THREE.MeshBasicMaterial({color:0x40362e});
 // window on the +z side (behind camera) and right
 for(let i=0;i<3;i++){const p=new THREE.Mesh(new THREE.PlaneGeometry(1.4,2.4),win);p.position.set(-2+i*1.55,.4,5.9);p.rotation.y=Math.PI;s.add(p);}
 for(let i=0;i<2;i++){const p=new THREE.Mesh(new THREE.PlaneGeometry(1.6,2.4),win);p.position.set(5.9,.4,-1+i*1.8);p.rotation.y=-Math.PI/2;s.add(p);}
 const lamp=new THREE.MeshBasicMaterial({color:0xffe2b8});lamp.color.multiplyScalar(14);
 for(let x=-3;x<=3;x+=1.5)for(let z=-3;z<=3;z+=2){const d=new THREE.Mesh(new THREE.CircleGeometry(.09,24),lamp);d.position.set(x,1.98,z);d.rotation.x=Math.PI/2;s.add(d);}
 const pm=new THREE.PMREMGenerator(R);const env=pm.fromScene(s,0.02).texture;return env;}
window.ENV=makeEnv();

// ---------- helpers ----------
window.THREE=THREE;window.R=R;window.X=X;window.RBox=RoundedBoxGeometry;
window.box=(scene,mat,w,h,d,x,y,z,r=0.004,cast=true)=>{const g=r>0?new RoundedBoxGeometry(w,h,d,2,r):new THREE.BoxGeometry(w,h,d);
 const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m;};
window.lerp=lerp;window.clamp=clamp;
window.ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
window.eo=t=>1-Math.pow(1-clamp(t),3);
</script>
